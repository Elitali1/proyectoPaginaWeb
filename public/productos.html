<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Donchichopizza - Productos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="marca">
  <img src="img/Logo.png" alt="Don Chicho" class="logo">
  <h1>Productos</h1>
  </div>
  <div class="barra-superior">
  
  <nav>
    <a href="pedidos.html">Pedidos</a>
    <a href="productos.html" id="link-productos">Productos</a>
    <a href="insumos.html" id="link-insumos">Insumos</a>
    <a href="compras.html" id="link-compras">Compras</a>
    <a href="caja.html" id="link-caja">Cierre de caja</a>
    <a href="usuarios.html" id="link-usuarios">Usuarios</a>
    <a href="historial.html">Historial</a>
    <a href="clientes.html" id="link-clientes">Clientes</a>
    <a href="dashboard.html" id="link-dashboard">Dashboard</a>
  </nav>
  <div>
    <p id="info-usuario"></p>
    <button id="btn-logout">Cerrar sesión</button>
  </div>
</div>

  <section>
  <h2 id="titulo-formulario">Agregar producto</h2>
  <form id="formulario-producto">
    <label>Nombre: <input type="text" id="nombre" required></label>
    <label>Precio: <input type="number" id="precio" required></label>
    <label>Categoría:
      <select id="categoria" required>
        <option value="">Cargando categorías...</option>
      </select>
    </label>
    <label>Nombre de archivo de imagen (opcional): <input type="text" id="imagen" placeholder="ej: napolitana.jpg"></label>
    <label>
      <input type="checkbox" id="disponible" checked>
      Disponible
    </label>
    <button type="submit" id="btn-guardar">Guardar</button>
    <button type="button" id="btn-cancelar-edicion" class="oculto">Cancelar</button>
  </form>

  <div id="seccion-subir-foto" class="oculto">
    <label>Subir foto del producto:
      <input type="file" id="archivo-imagen" accept="image/jpeg,image/png,image/webp">
    </label>
    <button type="button" id="btn-subir-foto">Subir foto</button>
    <span id="mensaje-subida"></span>
  </div>

  <div id="seccion-receta" class="oculto">
    <h3>Receta (insumos que consume)</h3>
    <label>Insumo:
      <select id="receta-insumo"></select>
    </label>
    <label>Cantidad: <input type="number" id="receta-cantidad" step="0.001" min="0.001"></label>
    <button type="button" id="btn-agregar-item-receta">Agregar a la receta</button>

    <ul id="lista-receta"></ul>

    <button type="button" id="btn-guardar-receta">Guardar receta</button>

    <div id="resultado-costo"></div>
  </div>
</section>

  <section>
    <h2>Catálogo</h2>
    <div id="contenedor-productos"></div>
  </section>

  <script src="auth-helpers.js"></script>
  <script src="productos.js"></script>
</body>
</html>
