<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donchichopizza - Usuarios</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="estilos.css">
  <!-- panel-base.css: base compartida del panel nuevo. tablas-pro.css: piezas de las pantallas con tabla. -->
  <link rel="stylesheet" href="panel-base.css">
  <link rel="stylesheet" href="tablas-pro.css">
  <!-- Metadatos: autor, descripción, palabras clave y color del tema -->
  <meta name="description" content="Panel de gestión de Donchichopizza: Usuarios.">
  <meta name="author" content="Elias Aguirre">
  <meta name="keywords" content="gestión, panel, usuarios, Donchichopizza">
  <meta name="theme-color" content="#7A2E28">
  <link rel="icon" href="img/Logo.png">
</head>
<body class="panel-base">
  <header class="barra-superior">
    <div class="marca">
      <img src="img/Logo.png" alt="Don Chicho" class="logo">
      <h1>Usuarios</h1>
    </div>

    <nav>
      <a href="pedidos.html">Pedidos</a>
      <a href="productos.html" id="link-productos">Productos</a>
      <a href="insumos.html" id="link-insumos">Insumos</a>
      <a href="compras.html" id="link-compras">Compras</a>
      <a href="caja.html" id="link-caja">Cierre de caja</a>
      <a href="usuarios.html" id="link-usuarios">Usuarios</a> <a href="sucursales.html" id="link-sucursales">Sucursales</a>
      <a href="historial.html">Historial</a>
      <a href="clientes.html" id="link-clientes">Clientes</a>
      <a href="dashboard.html" id="link-dashboard">Dashboard</a>
    </nav>
    <div>
      <p id="info-usuario"></p>
      <button id="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <main class="pro-contenido">
    <div class="pro-layout">

      <!-- ================= TABLA DE USUARIOS ================= -->
      <section class="pro-tarjeta pro-catalogo" aria-label="Usuarios del sistema">
        <h2 class="pro-titulo">Usuarios del sistema</h2>

        <div class="pro-barra">
          <label class="pro-campo pro-campo-buscar">Buscar usuario
            <input type="search" id="buscar-usuario" placeholder="Nombre o email" autocomplete="off">
          </label>
          <button type="button" id="btn-agregar-usuario" class="btn-pro">Crear usuario</button>
        </div>

        <div id="chips-rol" class="pro-chips" role="group" aria-label="Filtrar por rol"></div>

        <div class="pro-tabla-wrap">
          <table class="pro-tabla">
            <thead>
              <tr>
                <th scope="col">Usuario</th>
                <th scope="col">Email</th>
                <th scope="col">Rol</th>
                <th scope="col" id="columna-sucursal" class="oculto">Sucursal</th>
                <th scope="col" class="col-acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="contenedor-usuarios"></tbody>
          </table>
          <div id="sin-usuarios" class="pro-vacio oculto"><p>No hay usuarios cargados todavía.</p></div>
          <div id="sin-resultados-usuarios" class="pro-vacio oculto">
            <p>No hay usuarios que coincidan.</p>
            <button type="button" id="btn-limpiar-filtros-usuarios" class="btn-pro btn-amarillo">Limpiar filtros</button>
          </div>
        </div>

        <div class="pro-pie">
          <div id="rango-usuarios" class="pro-rango"></div>
          <nav id="paginacion-usuarios" class="pro-paginacion" aria-label="Páginas"></nav>
        </div>
      </section>

      <!-- ================= PANEL: CREAR / EDITAR ================= -->
      <section id="panel-usuario" class="pro-tarjeta pro-panel oculto" aria-label="Datos del usuario">
        <div class="pro-cabecera-panel">
          <h2 id="titulo-formulario" class="pro-titulo">Crear nuevo usuario</h2>
          <button type="button" id="btn-cerrar-panel-usuario" class="btn-sec btn-chico">Cerrar</button>
        </div>

        <p id="mensaje-panel-usuario" class="pro-aviso pro-aviso-error oculto" role="alert"></p>

        <form id="formulario-usuario" class="pestana activa" autocomplete="off">
          <label class="pro-campo">Nombre
            <input type="text" id="nombre" required>
          </label>
          <label class="pro-campo">Email
            <input type="email" id="email" required autocomplete="new-email">
          </label>
          <label class="pro-campo">Contraseña<span id="etiqueta-password-opcional"></span>
            <input type="password" id="password" autocomplete="new-password">
          </label>
          <label class="pro-campo">Rol
            <select id="rol">
              <option value="cajero">Cajero</option>
              <option value="admin">Administrador</option>
            </select>
          </label>
          <!-- Se muestra solo cuando hay más de una sucursal (mientras haya una, el panel se ve igual que siempre). -->
          <label id="campo-sucursal" class="pro-campo oculto">Sucursal
            <select id="sucursal"></select>
          </label>
          <div class="pro-botones">
            <button type="submit" id="btn-guardar" class="btn-pro">Crear usuario</button>
            <button type="button" id="btn-cancelar-edicion" class="btn-sec">Cancelar</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="auth-helpers.js"></script>
  <script src="usuarios.js"></script>
  <!-- Animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" integrity="sha384-n1AULnKdMJlK1oQCLNDL9qZsDgXtH6jRYFCpBtWFc+a9Yve0KSoMn575rk755NJZ" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" integrity="sha384-fXdIufVbE9aU7STmdk/DWK0imNOozId9fTwzM/gi0NfPjphEIC3gq0M760UnsKVy" crossorigin="anonymous"></script>
  <script src="animaciones.js"></script>
</body>
</html>
