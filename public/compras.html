<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Donchichopizza - Compras</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="marca">
  <img src="img/Logo.png" alt="Don Chicho" class="logo">
  <h1>Compras</h1>
  </div>
  <div class="barra-superior">
    
    <nav>
      <a href="pedidos.html">Pedidos</a>
      <a href="productos.html">Productos</a>
      <a href="insumos.html" id="link-insumos">Insumos</a>
      <a href="compras.html">Compras</a>
      <a href="caja.html">Cierre de caja</a>
      <a href="usuarios.html" id="link-usuarios">Usuarios</a>
      <a href="historial.html">Historial</a>
      <a href="clientes.html" id="link-clientes">Clientes</a>
      <a href="dashboard.html" id="link-dashboard">Dashboard</a>
    </nav>
    <div>
      <p id="info-usuario"></p>
      <button id="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <section>
    <h2>Cargar factura de compra</h2>
    <form id="formulario-compra">
      <label>Proveedor: <input type="text" id="proveedor" required></label>
      <label>Concepto: <input type="text" id="concepto" placeholder="Ej: Muzzarella x 20kg"></label>
      <label>Monto: <input type="number" id="monto" required></label>
      <label>Fecha: <input type="date" id="fecha" required></label>
      <button type="submit">Guardar</button>
    </form>
  </section>

  <section id="seccion-detalle-compra" class="oculto">
    <h2>Itemizar esta compra</h2>
    <p>Cargá cada insumo comprado, para actualizar el stock y el costo automáticamente.</p>

    <label>Insumo:
      <select id="detalle-insumo"></select>
    </label>
    <label>Cantidad: <input type="number" id="detalle-cantidad" step="0.01" min="0.01"></label>
    <label>Precio unitario: <input type="number" id="detalle-precio" step="0.01" min="0.01"></label>
    <button type="button" id="btn-agregar-detalle">Agregar item</button>

    <ul id="lista-detalle-compra"></ul>

    <button type="button" id="btn-guardar-detalle">Guardar detalle de la compra</button>
    <button type="button" id="btn-omitir-detalle">Omitir (no itemizar esta compra)</button>

    <div id="alertas-precio"></div>
  </section>

  <section>
    <h2>Historial de compras</h2>

    <label>Filtrar desde: <input type="date" id="filtro-desde"></label>
    <label>hasta: <input type="date" id="filtro-hasta"></label>
    <button type="button" id="btn-filtrar">Filtrar</button>
    <button type="button" id="btn-limpiar-filtro">Ver todas</button>

    <p id="total-filtrado"></p>
    <div id="contenedor-compras"></div>
  </section>

  <script src="auth-helpers.js"></script>
  <script src="compras.js"></script>
</body>
</html>
