<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Olvidé mi contraseña</title>
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body>
    <main class="container">
      <h1>Recuperar contraseña</h1>
      <p>Ingresá el email asociado a tu cuenta y te vamos a enviar un link para restablecer la contraseña.</p>

      <form id="form-solicitar-reset">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Enviar link de reset</button>
      </form>

      <div id="mensaje" aria-live="polite" style="margin-top:1rem"></div>

      <p><a href="login.html">Volver al inicio de sesión</a></p>
    </main>

    <script src="olvide-password.js"></script>
    <!-- Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="animaciones.js"></script>
  </body>
</html>
