<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Olvidé mi contraseña</title>
  <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body>
    <main class="container">
      <h1>Recuperar contraseña</h1>
      <p>Ingresá el email asociado a tu cuenta y te vamos a enviar un link para restablecer la contraseña.</p>

      <form id="form-solicitar-reset">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Enviar link de reset</button>
      </form>

      <div id="mensaje" aria-live="polite" style="margin-top:1rem"></div>

      <p><a href="login.html">Volver al inicio de sesión</a></p>
    </main>

    <script src="olvide-password.js"></script>
    <!-- Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" integrity="sha384-n1AULnKdMJlK1oQCLNDL9qZsDgXtH6jRYFCpBtWFc+a9Yve0KSoMn575rk755NJZ" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" integrity="sha384-fXdIufVbE9aU7STmdk/DWK0imNOozId9fTwzM/gi0NfPjphEIC3gq0M760UnsKVy" crossorigin="anonymous"></script>
    <script src="animaciones.js"></script>
  </body>
</html>
