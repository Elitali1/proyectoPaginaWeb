<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donchichopizza - Ingresar</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="estilos.css">
  <!-- Metadatos: autor, descripción, palabras clave y color del tema -->
  <meta name="description" content="Panel de gestión de Donchichopizza: Ingreso al sistema.">
  <meta name="author" content="Elias Aguirre">
  <meta name="keywords" content="gestión, panel, ingreso al sistema, Donchichopizza">
  <meta name="theme-color" content="#7A2E28">
  <link rel="icon" href="img/Logo.png">
</head>
<body class="login">
  <div class="cabecera-login">
    <a class="marca" href="index.html">
      <img src="img/Logo.png" alt="Don Chicho" class="logo">
      <h1>Donchichopizza</h1>
    </a>
  </div>

  <main>
  <section>
    <h2>Iniciar sesión</h2>
    <form id="formulario-login">
      <label>Email: <input type="email" id="email" required></label>
      <label>Contraseña: <input type="password" id="password" required></label>
      <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje-error" class="oculto"></p>

    <p class="fila-olvide"><a class="forgot-link" href="olvide-password.html" target="_blank" rel="noopener">¿Olvidaste tu contraseña?</a></p>
  </section>
  </main>

  <script src="login.js"></script>
  <!-- Animations: AOS + Anime.js + custom -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" integrity="sha384-n1AULnKdMJlK1oQCLNDL9qZsDgXtH6jRYFCpBtWFc+a9Yve0KSoMn575rk755NJZ" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" integrity="sha384-fXdIufVbE9aU7STmdk/DWK0imNOozId9fTwzM/gi0NfPjphEIC3gq0M760UnsKVy" crossorigin="anonymous"></script>
</body>
</html>
