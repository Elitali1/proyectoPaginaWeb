<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Donchichopizza - Ingresar</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="marca">
  <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
  <img src="img/Logo.png" alt="Don Chicho" class="logo">
  <h1>Donchichopizza</h1>
  </a>
  </div>

  <section>
    <h2>Iniciar sesión</h2>
    <form id="formulario-login">
      <label>Email: <input type="email" id="email" required></label>
      <label>Contraseña: <input type="password" id="password" required></label>
      <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje-error" class="oculto"></p>

    <p style="margin-top:1rem"><a class="forgot-link" href="olvide-password.html" target="_blank" rel="noopener">¿Olvidaste tu contraseña?</a></p>
  </section>

  <script src="login.js"></script>
  <!-- Animations: AOS + Anime.js + custom -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="animaciones.js"></script>
</body>
</html>
